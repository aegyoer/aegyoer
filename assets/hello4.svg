<style>
.jump{animation:jump 1.6s ease-in-out infinite}@keyframes jump{0%,100%{transform:translateY(0)}25%{transform:translateY(-9px)}50%{transform:translateY(0)}}
.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.1;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.rise{animation:rise 6s linear infinite}@keyframes rise{0%{transform:translateY(280px) rotate(-10deg);opacity:0}10%{opacity:1}80%{opacity:.9}100%{transform:translateY(-30px) rotate(12deg);opacity:0}}
.drift{animation:drift 26s linear infinite}@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(1060px)}}
.sway{animation:sway 2.4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-3px)}}
.bob{animation:bob 2.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.wig{animation:wig 1.8s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.shine{animation:shine 4.5s ease-in-out infinite}@keyframes shine{0%{transform:translateX(-300px)}55%,100%{transform:translateX(1200px)}}
.shoot{animation:shoot 7s ease-in infinite}@keyframes shoot{0%{transform:translate(-80px,-20px);opacity:0}4%{opacity:1}22%{transform:translate(420px,90px);opacity:0}100%{transform:translate(420px,90px);opacity:0}}
</style>
