<pattern id="dt" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="2.2" fill="#fff" opacity=".8"/></pattern>
<linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#ff5caa"/><stop offset=".25" stop-color="#ffe46e"/><stop offset=".5" stop-color="#7ee8c4"/><stop offset=".75" stop-color="#7cc4ff"/><stop offset="1" stop-color="#b89cff"/></linearGradient>
