name: letterboxd card

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the movie night card
        run: python scripts/letterboxd_card.py
      - name: commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet || true
          git add assets/letterboxd.svg
          if ! git diff --cached --quiet; then
            # new version number on the image link so github shows the fresh card, not a cached one
            sed -i -E "s#assets/letterboxd\.svg(\?v=[0-9]+)?\"#assets/letterboxd.svg?v=$(date +%s)\"#" README.md
            git add README.md
            git commit -m "🎬 update movie night"
            git push
          fi
